name: Listonic API contract health

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: api-contract-health
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LISTONIC__EMAIL: ${{ secrets.TEST_LISTONIC_EMAIL }}
      LISTONIC__PASSWORD: ${{ secrets.TEST_LISTONIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Run API tests
        run: dotnet test --project src/ListonicApiClient.Tests

      - name: Open or update issue on failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create api-contract-health --color D93F0B --description "Scheduled API contract health failures" 2>/dev/null || true
          existing=$(gh issue list --label api-contract-health --state open --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "Listonic API contract health failing" \
              --label api-contract-health \
              --body "Scheduled run failed: $RUN_URL"
          else
            gh issue comment "$existing" --body "Still failing: $RUN_URL"
          fi
