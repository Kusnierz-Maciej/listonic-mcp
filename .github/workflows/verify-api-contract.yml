name: Verify Listonic API contract compatibility

on:
  schedule:
    - cron: '25 3 * * *'
      timezone: "Europe/Warsaw"
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag, branch or SHA to test (default: latest released v* tag)'
        required: false

concurrency:
  group: api-contract-compatibility
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  verify-contract:
    name: Verify API contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LISTONIC__EMAIL: ${{ secrets.TEST_LISTONIC_EMAIL }}
      LISTONIC__PASSWORD: ${{ secrets.TEST_LISTONIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve ref to test
        id: ref
        env:
          INPUT_REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="$INPUT_REF"
          if [ -z "$ref" ]; then
            # Default: the latest v* tag that has a PUBLISHED release. This skips a
            # "dangling" tag whose release workflow failed (tag pushed, no image/release),
            # so the scheduled check doesn't test an unreleased commit.
            for t in $(git tag -l 'v*' --sort=-v:refname); do
              if gh release view "$t" >/dev/null 2>&1; then ref="$t"; break; fi
            done
          fi
          if [ -z "$ref" ]; then echo "No released v* tag found"; exit 1; fi
          git checkout --detach "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Testing **$ref** ($(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run live API tests
        run: dotnet test --project src/ListonicApiClient.Tests --treenode-filter '/**[Category=LiveApi]'

      - name: Open or update issue on failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_REF: ${{ steps.ref.outputs.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create api-contract-compatibility --color D93F0B --description "Scheduled API contract compatibility failures" 2>/dev/null || true
          existing=$(gh issue list --label api-contract-compatibility --state open --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "Listonic API contract compatibility check failing" \
              --label api-contract-compatibility \
              --body "Scheduled run failed on $TESTED_REF: $RUN_URL"
          else
            gh issue comment "$existing" --body "Still failing on $TESTED_REF: $RUN_URL"
          fi
