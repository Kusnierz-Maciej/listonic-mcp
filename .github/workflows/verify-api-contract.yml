name: Verify Listonic API contract compatibility

on:
  schedule:
    - cron: '47 2 * * *'  # 03:47 CET (winter) / 04:47 CEST (summer); cron is UTC-only
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag, branch or SHA to test (default: latest v* tag)'
        required: false

concurrency:
  group: api-contract-compatibility
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  verify-contract:
    name: Verify API contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LISTONIC__EMAIL: ${{ secrets.TEST_LISTONIC_EMAIL }}
      LISTONIC__PASSWORD: ${{ secrets.TEST_LISTONIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve ref to test
        id: ref
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          ref="${INPUT_REF:-$(git tag -l 'v*' --sort=-v:refname | head -1)}"
          if [ -z "$ref" ]; then echo "No v* tag found"; exit 1; fi
          git checkout --detach "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Testing **$ref** ($(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Run API tests
        run: dotnet test --project src/ListonicApiClient.Tests

      - name: Open or update issue on failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_REF: ${{ steps.ref.outputs.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create api-contract-compatibility --color D93F0B --description "Scheduled API contract compatibility failures" 2>/dev/null || true
          existing=$(gh issue list --label api-contract-compatibility --state open --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "Listonic API contract compatibility check failing" \
              --label api-contract-compatibility \
              --body "Scheduled run failed on $TESTED_REF: $RUN_URL"
          else
            gh issue comment "$existing" --body "Still failing on $TESTED_REF: $RUN_URL"
          fi
